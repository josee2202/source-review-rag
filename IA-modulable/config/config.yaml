ollama:
  host: localhost
  port: 11434
llm:
  embed:
    name: nomic-embed-text
    batch_size: 32        # textos por petición a Ollama; lotes de ~250+ provocan errores en /tokenize
  text:
    name: llama3.2:1b     # solo para el comentario opcional
    max_tokens: 512       # límite de tokens generados por comentario; sin él, el modelo de 1B puede entrar en bucle
    timeout_s: 300        # un comentario que no responde se registra como fallo y no bloquea el resto
chunking:                 # forma parte de la huella del índice: cambiarlo fuerza una indexación nueva
  reference: {size: 800, overlap: 200}
  review: {size: 600, overlap: 200}
qdrant:
  location: qdrant_storage   # ruta relativa a la raíz del proyecto (modo embebido), URL de un servidor o ":memory:"
