# Evaluation set: 30 atomic claims, 10 per expected label, across the three modes.
# Synthetic: every entity, figure and document is fictitious and no outside knowledge is needed.
# Written and labelled by the assistant (Claude Code). See review_status below.
# Case IDs carry no information about the label. Labels, evidence, quotes and rationales never reach the prompt.
split: eval
review_status: >-
  Constructed and reviewed by the assistant (Claude Code). No human review of the cases or labels had taken
  place when the set was frozen. Not an independent benchmark and not representative of real news.
scenarios:
  T1:
    modality: text_vs_text
    passages:
      A:
        source: Ordenanza de residuos de Valdemora
        text: >-
          La ordenanza de residuos de Valdemora, aprobada por el pleno municipal el 14 de marzo de 2024, obliga a las
          comunidades de más de 20 viviendas a instalar un contenedor de compostaje antes del 1 de enero de 2026. Las
          comunidades de 20 viviendas o menos quedan exentas de esta obligación. El contenedor deberá colocarse en una
          zona común accesible para todos los vecinos y la comunidad nombrará a una persona responsable de su
          mantenimiento.
      B:
        source: Ordenanza de residuos de Valdemora
        text: >-
          El ayuntamiento subvencionará el 40 % del coste del contenedor, con un máximo de 1.200 euros por comunidad.
          Las solicitudes se presentarán en la sede electrónica municipal durante el primer semestre de cada año y se
          resolverán en un plazo máximo de 60 días desde su presentación. Si en ese plazo no hay respuesta, la solicitud
          se entenderá desestimada y la comunidad podrá presentarla de nuevo el año siguiente.
      C:
        source: Guía vecinal de servicios de Valdemora
        text: >-
          El servicio municipal de recogida de residuos voluminosos de Valdemora funciona los martes y los jueves. Los
          vecinos deben solicitarlo por teléfono con dos días de antelación y el servicio es gratuito hasta tres muebles
          por vivienda. Los residuos de obra quedan fuera de este servicio y deben llevarse al punto limpio, que abre de
          lunes a sábado en el polígono de Las Eras.
    cases:
      - id: EV-01
        claim: Las comunidades que tengan un máximo de 20 viviendas no están obligadas a instalar el contenedor de compostaje.
        passage_order: [C, A, B]
        label: supported
        evidence: [A]
        quote: Las comunidades de 20 viviendas o menos quedan exentas de esta obligación
        tags: [paraphrase, negation]
        rationale: Reformula la exención sin cambiar el umbral de 20 viviendas.
      - id: EV-02
        claim: El ayuntamiento dispone de hasta 90 días para resolver las solicitudes de subvención del contenedor.
        passage_order: [B, A, C]
        label: contradicted
        evidence: [B]
        quote: se resolverán en un plazo máximo de 60 días
        required_values: ["90", "60"]
        critical: true
        tags: [deadline_60_90, figure]
        rationale: El pasaje fija un máximo de 60 días; la afirmación da 90.
      - id: EV-03
        claim: El contenedor de compostaje se vacía los martes y los jueves.
        passage_order: [C, B, A]
        label: insufficient_evidence
        critical: true
        tags: [lexical_distractor]
        rationale: Martes y jueves corresponden a los residuos voluminosos. Ningún pasaje dice cuándo se vacía el contenedor.
  T2:
    modality: text_vs_text
    passages:
      A:
        source: Nota de la Diputación de Ribera Alta
        text: >-
          La Biblioteca Central de Ribera Alta ampliará su horario a partir del 3 de septiembre de 2025: abrirá de lunes
          a sábado de 8:00 a 22:00. Los domingos permanecerá cerrada, salvo durante el periodo de exámenes universitarios
          de junio, cuando abrirá de 9:00 a 14:00. La dirección de la biblioteca justifica el cambio por el aumento de
          usuarios registrado en el último curso.
      B:
        source: Nota de la Diputación de Ribera Alta
        text: >-
          La reforma del edificio de la Biblioteca Central costará 2,4 millones de euros y se financiará a partes iguales
          entre la Diputación de Ribera Alta y la Fundación Olmedo. La obra añadirá 180 puestos de lectura a los 320
          actuales, además de una sala infantil en la planta baja. Los trabajos empezarán cuando termine el curso y se
          prevé que duren once meses.
      C:
        source: Web de la Universidad de Ribera Alta
        text: >-
          La Biblioteca del Campus Norte, gestionada por la Universidad de Ribera Alta, ofrece préstamo de portátiles
          durante 7 días a estudiantes y personal docente. Su horario no cambiará este curso y seguirá cerrando a las
          21:00. Para usar el servicio hay que presentar el carné universitario y firmar un compromiso de devolución.
    cases:
      - id: EV-04
        claim: Cuando acabe la obra, la Biblioteca Central tendrá 500 puestos de lectura.
        passage_order: [A, C, B]
        label: supported
        evidence: [B]
        quote: añadirá 180 puestos de lectura a los 320 actuales
        tags: [paraphrase, figure, simple_sum]
        rationale: 180 puestos nuevos más 320 actuales son 500. Es una reformulación legítima que no aparece literalmente.
      - id: EV-05
        claim: La Biblioteca Central ampliará su horario a partir del 3 de octubre de 2025.
        passage_order: [A, B, C]
        label: contradicted
        evidence: [A]
        quote: a partir del 3 de septiembre de 2025
        required_values: [octubre, septiembre]
        critical: true
        tags: [date]
        rationale: La fecha del pasaje es el 3 de septiembre; la afirmación dice el 3 de octubre.
      - id: EV-06
        claim: La Biblioteca Central prestará portátiles a sus usuarios.
        passage_order: [B, C, A]
        label: insufficient_evidence
        critical: true
        tags: [lexical_distractor, wrong_entity]
        rationale: El préstamo de portátiles es de la Biblioteca del Campus Norte. Nada indica si la Central lo ofrece o no.
  T3:
    modality: text_vs_text
    passages:
      A:
        source: El Eco de Villanúa
        text: >-
          La empresa Transportes Lumbre operará en exclusiva desde el 1 de febrero de 2026 la nueva línea L7 entre Puerto
          Alcor y Villanúa. El trayecto durará 35 minutos y habrá una salida cada 20 minutos en hora punta y cada 40
          minutos el resto del día. El servicio empleará seis autobuses eléctricos que se recargarán en las cocheras de
          Puerto Alcor.
      B:
        source: El Eco de Villanúa
        text: >-
          El billete sencillo de la línea L7 costará 1,50 euros. Los menores de 12 años viajarán gratis y los jubilados
          pagarán 0,75 euros si muestran la tarjeta municipal. Los abonos mensuales se podrán comprar en las oficinas de
          turismo de ambos municipios y a través de la aplicación del consorcio comarcal de transporte.
      C:
        source: Radio Comarca
        text: >-
          La línea L3, que opera la empresa Autocares Brisa, conecta Villanúa con el hospital comarcal. El consistorio
          estudia ampliar su frecuencia, aunque todavía no ha fijado una fecha para hacerlo. La concejala de Movilidad
          recordó que la línea transporta unos 900 viajeros al día y que sus vehículos disponen de rampa de acceso.
    cases:
      - id: EV-07
        claim: Los jubilados con tarjeta municipal pagarán la mitad del precio del billete sencillo de la línea L7.
        passage_order: [B, A, C]
        label: supported
        evidence: [B]
        quote: los jubilados pagarán 0,75 euros si muestran la tarjeta municipal
        tags: [paraphrase, figure]
        rationale: 0,75 euros es la mitad de 1,50 euros, ambos en el mismo pasaje.
      - id: EV-08
        claim: La línea L7 la operará la empresa Autocares Brisa.
        passage_order: [C, A, B]
        label: contradicted
        evidence: [A]
        quote: La empresa Transportes Lumbre operará en exclusiva
        critical: true
        tags: [wrong_entity, lexical_distractor]
        rationale: Transportes Lumbre operará la L7 en exclusiva; Autocares Brisa opera la L3.
      - id: EV-09
        claim: Los autobuses de la línea L7 tendrán wifi gratuito a bordo.
        passage_order: [A, C, B]
        label: insufficient_evidence
        tags: [absent]
        rationale: Ningún pasaje menciona el wifi. La ausencia no lo desmiente.
  R1:
    modality: report_vs_news
    passages:
      A:
        source: Informe anual 2024 del Organismo Regulador de Energía de Nortia (OREN)
        text: >-
          El OREN establece que las comercializadoras dispondrán de 90 días naturales para resolver las reclamaciones de
          facturación. Transcurrido ese plazo sin respuesta, el cliente podrá acudir de forma gratuita al servicio
          arbitral del organismo. Las comercializadoras deberán informar de este derecho en la primera respuesta que
          envíen al cliente y en todas las facturas posteriores a la reclamación.
      B:
        source: Informe anual 2024 del Organismo Regulador de Energía de Nortia (OREN)
        text: >-
          El informe contabiliza 48.200 reclamaciones en 2024, un 12 % más que en 2023. El 64 % se refería a errores de
          facturación y el resto a cambios de comercializadora no solicitados. La región con más reclamaciones por cada
          mil clientes fue Costa Nortia, seguida de la meseta central, mientras que las islas registraron la cifra más
          baja.
      C:
        source: Informe anual 2024 del Organismo Regulador de Energía de Nortia (OREN)
        text: >-
          En el capítulo dedicado a las telecomunicaciones, el informe recuerda que los operadores de telefonía móvil
          deben responder a las reclamaciones en un plazo de 60 días, conforme a su normativa sectorial. El OREN no
          supervisa a estos operadores y se limita a trasladar a la autoridad competente las quejas que recibe por error.
    cases:
      - id: EV-10
        claim: Las reclamaciones crecieron un 12 % en 2024 respecto al año anterior.
        passage_order: [C, B, A]
        label: supported
        evidence: [B]
        quote: un 12 % más que en 2023
        tags: [percentage, paraphrase]
        rationale: Reformula el aumento del 12 % frente a 2023.
      - id: EV-11
        claim: El OREN da a las comercializadoras 60 días naturales para resolver las reclamaciones de facturación.
        passage_order: [A, C, B]
        label: contradicted
        evidence: [A]
        quote: dispondrán de 90 días naturales
        required_values: ["60", "90"]
        critical: true
        tags: [deadline_60_90, evidence_first, lexical_distractor]
        rationale: Para las comercializadoras son 90 días. Los 60 días corresponden a los operadores móviles.
      - id: EV-12
        claim: El servicio arbitral del OREN tarda una media de 30 días en dictar su resolución.
        passage_order: [A, B, C]
        label: insufficient_evidence
        critical: true
        tags: [lexical_distractor, figure]
        rationale: Se menciona el servicio arbitral, pero no cuánto tarda.
  R2:
    modality: report_vs_news
    passages:
      A:
        source: Encuesta de empleo de la Oficina Estadística de Sierra Clara
        text: >-
          La Oficina Estadística de Sierra Clara informa de que el paro bajó al 6,2 % en marzo de 2025 entre las personas
          de 25 a 54 años. La encuesta no incluye a los menores de 25 años ni a los mayores de 54, que se analizan en una
          publicación separada. La oficina advierte de que los datos son provisionales y podrán revisarse en la nota
          definitiva de junio.
      B:
        source: Encuesta de empleo de la Oficina Estadística de Sierra Clara
        text: >-
          La encuesta se realizó en 12 comarcas con una muestra de 18.500 hogares. Los datos se recogieron entre el 3 y el
          28 de abril de 2025 mediante entrevistas telefónicas y presenciales. La tasa de respuesta fue del 71 %, dos
          puntos menos que en la edición anterior, según la ficha metodológica que acompaña a la publicación.
      C:
        source: Nota de la Consejería de Trabajo de Sierra Clara
        text: >-
          El paro juvenil es el objetivo de un programa de la Consejería de Trabajo que ofrece 2.000 plazas de formación
          dual en empresas de la región. La consejería no ha publicado todavía resultados del programa y prevé hacerlo al
          finalizar la primera convocatoria. Las solicitudes pueden presentarse en las oficinas de empleo hasta el 30 de
          septiembre.
    cases:
      - id: EV-13
        claim: La encuesta se basa en una muestra de 18.500 hogares de 12 comarcas.
        passage_order: [C, A, B]
        label: supported
        evidence: [B]
        quote: en 12 comarcas con una muestra de 18.500 hogares
        tags: [figure, paraphrase]
        rationale: Mismos datos con otro orden de palabras.
      - id: EV-14
        claim: El dato de paro del 6,2 % corresponde a toda la población de Sierra Clara, incluidos los menores de 25 años.
        passage_order: [B, A, C]
        label: contradicted
        evidence: [A]
        quote: La encuesta no incluye a los menores de 25 años
        critical: true
        tags: [scope, negation]
        rationale: El pasaje limita el dato a personas de 25 a 54 años y excluye expresamente a los menores de 25.
      - id: EV-15
        claim: El programa de formación dual ha reducido el paro juvenil un 5 %.
        passage_order: [C, B, A]
        label: insufficient_evidence
        critical: true
        tags: [lexical_distractor, figure]
        rationale: El programa existe, pero sus resultados no se han publicado. Ni se confirma ni se desmiente el 5 %.
  R3:
    modality: report_vs_news
    passages:
      A:
        source: Memoria de sostenibilidad 2024 del Grupo Alvento
        text: >-
          En su memoria de 2024, el Grupo Alvento declara una reducción de sus emisiones directas del 18 % frente a 2019.
          La compañía aclara que esa cifra no incluye las emisiones de su cadena de suministro, que calculará por primera
          vez el próximo ejercicio. El objetivo declarado es alcanzar una reducción del 30 % en 2030 respecto al mismo año
          de referencia.
      B:
        source: Memoria de sostenibilidad 2024 del Grupo Alvento
        text: >-
          La inversión en energías renovables alcanzó los 35 millones de euros en 2024. De esa cantidad, 20 millones se
          destinaron a plantas solares en la comarca de Altamar y el resto a parques eólicos ya en funcionamiento. Según
          la memoria, estas instalaciones cubrieron el 42 % del consumo eléctrico de las fábricas del grupo durante el
          ejercicio.
      C:
        source: Memoria de sostenibilidad 2024 del Grupo Alvento
        text: >-
          El consumo de agua del grupo bajó un 9 % en 2024 gracias a la reutilización en sus plantas de envasado. Una
          auditoría externa, encargada a la firma Cuenta Clara, revisó las cifras de consumo de agua y no encontró
          incidencias significativas. La memoria incluye el informe completo de esa auditoría como anexo tercero.
    cases:
      - id: EV-16
        claim: La reducción de emisiones del 18 % no tiene en cuenta las de la cadena de suministro.
        passage_order: [B, A, C]
        label: supported
        evidence: [A]
        quote: esa cifra no incluye las emisiones de su cadena de suministro
        tags: [paraphrase, negation]
        rationale: Reformula la aclaración de la compañía sobre el alcance de la cifra.
      - id: EV-17
        claim: El Grupo Alvento invirtió 35.000 euros en energías renovables en 2024.
        passage_order: [C, A, B]
        label: contradicted
        evidence: [B]
        quote: alcanzó los 35 millones de euros
        required_values: ["35.000", "35 millones"]
        critical: true
        tags: [unit, figure]
        rationale: La inversión es de 35 millones de euros, no de 35.000 euros.
      - id: EV-18
        claim: Una auditoría externa ha verificado la reducción de emisiones del Grupo Alvento.
        passage_order: [C, A, B]
        label: insufficient_evidence
        critical: true
        tags: [lexical_distractor]
        rationale: La auditoría citada revisó el consumo de agua. Nada indica si alguna auditoría verificó las emisiones.
  R4:
    modality: report_vs_news
    passages:
      A:
        source: Comunicado de la Agencia Sanitaria de Lindavista
        text: >-
          La Agencia Sanitaria de Lindavista autorizó el medicamento Ventrol el 9 de mayo de 2025. El comunicado indica
          que Ventrol no está autorizado para menores de 12 años, porque el ensayo no incluyó a ese grupo de edad. Entre
          los 12 y los 17 años solo podrá prescribirlo un especialista, tras valorar cada caso de forma individual.
      B:
        source: Comunicado de la Agencia Sanitaria de Lindavista
        text: >-
          En el ensayo de Ventrol participaron 1.240 pacientes de 30 hospitales. El 8 % de los participantes notificó
          efectos adversos leves y ninguno sufrió efectos adversos graves. El seguimiento se prolongó durante 24 semanas y
          el laboratorio deberá presentar a la agencia un nuevo informe de seguridad dentro de dos años.
      C:
        source: Comunicado de la Agencia Sanitaria de Lindavista
        text: >-
          La agencia recuerda que el medicamento Cortaval, de otra categoría terapéutica, sí está autorizado a partir de
          los 6 años desde 2021. Las farmacias de Lindavista deberán conservar ambos medicamentos refrigerados. La agencia
          publicará en su web una guía sobre la conservación de medicamentos refrigerados antes de que termine el año.
    cases:
      - id: EV-19
        claim: Ningún participante del ensayo de Ventrol tuvo efectos adversos graves.
        passage_order: [A, C, B]
        label: supported
        evidence: [B]
        quote: ninguno sufrió efectos adversos graves
        tags: [negation, paraphrase]
        rationale: Reformulación directa de la frase del comunicado.
      - id: EV-20
        claim: Ventrol está autorizado para menores de 12 años.
        passage_order: [C, A, B]
        label: contradicted
        evidence: [A]
        quote: Ventrol no está autorizado para menores de 12 años
        critical: true
        tags: [negation, lexical_distractor]
        rationale: El comunicado lo niega expresamente. La autorización desde los 6 años es de otro medicamento.
      - id: EV-21
        claim: Ventrol se venderá en farmacias a partir de julio de 2025.
        passage_order: [B, A, C]
        label: insufficient_evidence
        tags: [absent, date]
        rationale: Ningún pasaje da una fecha de venta en farmacias.
  N1:
    modality: news_vs_newsletter
    passages:
      A:
        source: La Gaceta de Bahía Clara, 12/03/2025
        text: >-
          El Puerto de Bahía Clara movió 1,8 millones de contenedores en 2024, un récord histórico, según informó su
          presidenta, Marta Ilundain. El tráfico creció un 7 % respecto a 2023, impulsado por las nuevas rutas con el norte
          de Europa. Ilundain agradeció el trabajo de los estibadores y de las empresas consignatarias durante la
          presentación de los datos.
      B:
        source: Diario del Litoral, 13/03/2025
        text: >-
          El puerto vecino de Cala Serena registró en 2024 un descenso del 3 % en su tráfico de contenedores, hasta los
          900.000. Su director, Óscar Bellido, atribuye la caída a las obras de dragado, que obligaron a desviar escalas
          durante cuatro meses. Bellido espera recuperar esos servicios cuando terminen los trabajos, previsto para otoño.
      C:
        source: Noticias Bahía, 14/03/2025
        text: >-
          El Museo Marítimo de Bahía Clara abrirá en junio una sala dedicada a la fotografía portuaria, con más de 300
          imágenes cedidas por antiguos trabajadores del puerto. La entrada a la sala será gratuita durante los dos
          primeros meses. La exposición inaugural repasará la historia de la estiba desde los años cincuenta.
    cases:
      - id: EV-22
        claim: El tráfico de contenedores del Puerto de Bahía Clara aumentó un 7 % en 2024.
        passage_order: [A, B, C]
        label: supported
        evidence: [A]
        quote: El tráfico creció un 7 % respecto a 2023
        tags: [percentage, paraphrase]
        rationale: Reformula el crecimiento del 7 %.
      - id: EV-23
        claim: El Puerto de Bahía Clara registró en 2024 un descenso del 3 % en su tráfico de contenedores.
        passage_order: [B, C, A]
        label: contradicted
        evidence: [A]
        quote: El tráfico creció un 7 % respecto a 2023
        required_values: ["3", "7"]
        critical: true
        tags: [percentage, wrong_entity, cross_source]
        rationale: Bahía Clara creció un 7 %. El descenso del 3 % es de Cala Serena, otra fuente y otro puerto.
      - id: EV-24
        claim: Marta Ilundain anunció la ampliación del Puerto de Bahía Clara.
        passage_order: [C, A, B]
        label: insufficient_evidence
        critical: true
        tags: [lexical_distractor]
        rationale: Ilundain y el puerto aparecen, pero ningún pasaje menciona una ampliación.
  N2:
    modality: news_vs_newsletter
    passages:
      A:
        source: El Heraldo de Campomayor, 02/10/2025
        text: >-
          La Cooperativa Olivar del Sur recogió 12.500 toneladas de aceituna en la campaña de 2025, frente a las 15.000
          toneladas de la anterior. Su presidente culpa a la sequía de la primavera y pide ayudas a la Consejería de
          Agricultura. La cooperativa, que agrupa a 640 familias, destinará la mayor parte de la cosecha a la producción de
          aceite virgen extra.
      B:
        source: Agro Diario, 03/10/2025
        text: >-
          La Cooperativa San Isidro de Valtierra mantuvo su producción en 8.000 toneladas de aceituna en la campaña de
          2025, la misma cifra que el año anterior. Sus responsables lo atribuyen al riego por goteo instalado en 2023 en
          la mitad de sus parcelas. La entidad tiene previsto extender ese sistema al resto de las fincas en los próximos
          tres años.
      C:
        source: Mercados Hoy, 04/10/2025
        text: >-
          El precio medio del aceite de oliva subió a 6,40 euros por kilo en septiembre, según la lonja de Campomayor. Los
          operadores prevén otra subida a lo largo del invierno por la escasez de existencias. Las exportaciones a otros
          países cayeron un 5 % en el mismo periodo, según los datos que maneja la asociación de envasadores.
    cases:
      - id: EV-25
        claim: La cosecha de aceituna de la Cooperativa Olivar del Sur fue menor que la de la campaña anterior.
        passage_order: [C, A, B]
        label: supported
        evidence: [A]
        quote: 12.500 toneladas de aceituna en la campaña de 2025, frente a las 15.000 toneladas de la anterior
        tags: [paraphrase]
        rationale: 12.500 toneladas son menos que 15.000. La afirmación no repite las cifras.
      - id: EV-26
        claim: La Cooperativa San Isidro de Valtierra recogió 12.500 toneladas de aceituna en la campaña de 2025.
        passage_order: [A, B, C]
        label: contradicted
        evidence: [B]
        quote: mantuvo su producción en 8.000 toneladas
        required_values: ["12.500", "8.000"]
        critical: true
        tags: [figure, wrong_entity, cross_source]
        rationale: San Isidro produjo 8.000 toneladas. Las 12.500 son de Olivar del Sur, otra fuente y otra entidad.
      - id: EV-27
        claim: El precio del aceite de oliva bajará la próxima primavera.
        passage_order: [B, C, A]
        label: insufficient_evidence
        critical: true
        tags: [lexical_distractor]
        rationale: La previsión citada se refiere al invierno y es de subida. Nada se dice de la primavera.
  N3:
    modality: news_vs_newsletter
    passages:
      A:
        source: Crónica Ferroviaria, 20/01/2026
        text: >-
          La huelga de maquinistas de Ferrovías del Norte se desconvocó el 18 de enero de 2026 tras un acuerdo salarial con
          la empresa. El sindicato confirmó que no habrá paros en febrero y que la plantilla ratificará el texto en
          asamblea durante esta semana. La compañía recuperará el servicio habitual de trenes de cercanías a partir del
          próximo lunes.
      B:
        source: El Correo de Montearce, 21/01/2026
        text: >-
          El acuerdo de Ferrovías del Norte con sus maquinistas contempla una subida salarial del 4,5 % en 2026 y del 3 % en
          2027. Además, la empresa se compromete a convocar 40 plazas nuevas antes de que termine el año. Las dos partes
          crearán una comisión de seguimiento que se reunirá cada seis meses para revisar el cumplimiento de lo pactado.
      C:
