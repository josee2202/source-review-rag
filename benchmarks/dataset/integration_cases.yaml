# Control cases for the integration check of the production judge (not part of the frozen comparison).
# Written and labelled by the assistant before any of them was run. All content is fictitious, apart from IC-01 and
# IC-02/03, which reuse sentences of the repository's synthetic documents to test the points that failed in earlier
# free-text comments: the 60/90 day contrast and the wording of the exceptions.
#
# IC-11 to IC-15 were added for integration-check-v2, again before running them: v2 changes the prompt after reading the results of
# v1, so IC-01 to IC-10 are no longer unseen.
#
# Paragraphs with several claims follow the documented rule: one contradicted claim makes the paragraph contradicted;
# otherwise a missing material claim makes it insufficient_evidence; supported needs all of them backed.
split: integration
review_status: Constructed and labelled by the assistant (Claude Code). No human review.
scenarios:
  C1:
    modality: report_vs_news
    passages:
      A:
        source: normativa_sintetica_pd.pdf · p. 1
        text: >-
          La entidad considerará que una exposición está en situación de default cuando el deudor acumule más de 90 días
          de impago en una obligación significativa o cuando se considere improbable que pague sus obligaciones sin
          recurrir a la ejecución de garantías.
      B:
        source: normativa_sintetica_pd.pdf · p. 1
        text: >-
          La tasa media de default a largo plazo utilizada para calibrar la PD se calculará con un periodo de observación
          de al menos cinco años. Si la entidad dispone de un histórico más largo y relevante, deberá utilizarlo.
    cases:
      - id: IC-01
        claim: Una exposición entra en default con más de 60 días de impago.
        passage_order: [B, A]
        label: contradicted
        evidence: [A]
        quote: más de 90 días de impago
        required_values: ["60", "90"]
        critical: true
        tags: [days_60_90, number]
        rationale: La guía fija más de 90 días de impago, no 60.
  C2:
    modality: text_vs_text
    passages:
      A:
        source: resumen_plan_movilidad.txt · párr. 4
        text: >-
          La zona de bajas emisiones entrará en vigor el 1 de septiembre de 2027 y afectará únicamente al distrito centro.
          Los vehículos sin etiqueta ambiental no podrán acceder, salvo los de residentes y los de personas con movilidad
          reducida.
      B:
        source: resumen_plan_movilidad.txt · párr. 5
        text: >-
          El ayuntamiento creará una tarjeta única de transporte que permitirá usar autobús y bicicleta pública con el
          mismo abono.
    cases:
      - id: IC-02
        claim: >-
          Los vehículos sin etiqueta ambiental no podrán entrar en el distrito centro, con excepción de los de residentes
          y los de personas con movilidad reducida.
        passage_order: [A, B]
        label: supported
        evidence: [A]
        quote: salvo los de residentes y los de personas con movilidad reducida
        tags: [exceptions]
        rationale: El pasaje enumera las dos excepciones. Un comentario libre anterior afirmó que no se mencionaban.
      - id: IC-03
        claim: Los vehículos sin etiqueta ambiental no podrán entrar en el distrito centro, sin ninguna excepción.
        passage_order: [B, A]
        label: contradicted
        evidence: [A]
        quote: salvo los de residentes y los de personas con movilidad reducida
        critical: true
        tags: [exceptions, scope]
        rationale: El pasaje sí prevé excepciones para residentes y personas con movilidad reducida.
  C3:
    modality: text_vs_text
    passages:
      A:
        source: memoria_monteluz.txt · párr. 1
        text: >-
          El centro de salud de Monteluz atendió 18.000 consultas en 2024. Abre de lunes a sábado y cuenta con seis
          consultas de medicina general.
      B:
        source: memoria_monteluz.txt · párr. 2
        text: >-
          El centro ofrece fisioterapia desde 2022, con dos profesionales. Las citas se solicitan por teléfono o en la
          aplicación municipal.
    cases:
      - id: IC-04
        claim: >-
          El centro de salud de Monteluz atendió 18.000 consultas en 2024, cuenta con ocho consultas de medicina general y
          abrirá una unidad de pediatría en 2026.
        passage_order: [A, B]
        label: contradicted
        evidence: [A]
        quote: seis consultas de medicina general
        critical: true
        tags: [multi_claim, correct_contradicted_unsupported]
        rationale: Las 18.000 consultas son correctas, ocho contradice las seis del pasaje y la pediatría no aparece.
      - id: IC-05
        claim: El centro de salud de Monteluz atendió 18.000 consultas en 2024 y abrirá una unidad de pediatría en 2026.
        passage_order: [A, B]
        label: insufficient_evidence
        critical: true
        tags: [multi_claim, correct_unsupported]
        rationale: Las consultas están respaldadas; la pediatría carece de respaldo, pero nada la desmiente.
      - id: IC-06
        claim: El centro de salud de Monteluz abre de lunes a sábado y ofrece fisioterapia con dos profesionales.
        passage_order: [B, A]
        label: supported
        evidence: [A, B]
        tags: [multi_claim, all_supported]
        rationale: Cada afirmación está respaldada por un pasaje distinto.
      - id: IC-07
        claim: El centro de salud de Monteluz atendió 18.000 consultas en 2024.
        passage_order: [A, B]
        label: supported
        evidence: [A]
        quote: atendió 18.000 consultas en 2024
        tags: [irrelevant_omission]
        rationale: Omitir el horario y las consultas de medicina general no cambia lo que afirma el fragmento.
  C4:
    modality: news_vs_newsletter
    passages:
      A:
        source: El Correo de Arenales, 14/02/2025
        text: >-
          La Fundación Arenales entregó el viernes 40 becas de estudio a alumnos de bachillerato. Cada beca está dotada con
          1.500 euros.
      B:
        source: Diario de Sierra Alta, 15/02/2025
        text: >-
          El ayuntamiento de Sierra Alta aprobó el presupuesto de 2025, que asciende a 12 millones de euros, con los votos
          del equipo de gobierno.
    cases:
      - id: IC-08
        claim: La Fundación Arenales entregó 40 becas de estudio dotadas con 1.500 euros cada una.
        passage_order: [A, B]
        label: supported
        evidence: [A]
        tags: [simple_control]
        rationale: El pasaje da el número de becas y su dotación.
      - id: IC-09
        claim: El presupuesto de Sierra Alta para 2025 asciende a 21 millones de euros.
        passage_order: [A, B]
        label: contradicted
        evidence: [B]
        quote: 12 millones de euros
        required_values: ["21", "12"]
        critical: true
        tags: [simple_control, number]
        rationale: El presupuesto es de 12 millones, no de 21.
      - id: IC-10
        claim: La Fundación Arenales ampliará sus becas a estudiantes universitarios el próximo curso.
        passage_order: [B, A]
        label: insufficient_evidence
        critical: true
        tags: [simple_control, lexical_distractor]
        rationale: La fundación y las becas aparecen, pero nada dice sobre universitarios ni sobre el próximo curso.
  C5:
    modality: report_vs_news
    passages:
      A:
        source: informe_agua_valdeluna.pdf · p. 2
        text: >-
          Informe ficticio de gestión del agua de Valdeluna. A1. Consumo. El consumo medio por habitante fue de 118 litros al
          día en 2024, frente a los 126 litros de 2023. A2. Pérdidas. Las pérdidas en la red de distribución se situaron en el
          14 % del agua captada. El objetivo para 2030 es bajar del 10 %.
      B:
        source: informe_agua_valdeluna.pdf · p. 3
        text: >-
          A3. Inversiones. El plan prevé renovar 30 kilómetros de tuberías antes de 2028, con un coste de 9 millones de euros.
          A4. Tarifas. La tarifa no cambiará durante 2025.
    cases:
      - id: IC-11
        claim: Las pérdidas en la red de distribución de Valdeluna fueron del 21 % del agua captada.
        passage_order: [B, A]
        label: contradicted
        evidence: [A]
        quote: Las pérdidas en la red de distribución se situaron en el 14 % del agua captada
        required_values: ["21", "14"]
        critical: true
        tags: [number, long_passage_with_headings]
        rationale: El informe da un 14 %, no un 21 %.
      - id: IC-12
        claim: El informe obliga al ayuntamiento a instalar contadores inteligentes en todas las viviendas.
        passage_order: [A, B]
        label: insufficient_evidence
        critical: true
        tags: [long_passage_with_headings, lexical_distractor]
        rationale: El informe habla de consumo, pérdidas, inversiones y tarifas, pero no de contadores.
      - id: IC-13
        claim: El plan renovará 30 kilómetros de tuberías antes de 2028 y subirá la tarifa durante 2025.
        passage_order: [A, B]
        label: contradicted
        evidence: [B]
        quote: La tarifa no cambiará durante 2025
        critical: true
        tags: [multi_claim, correct_and_contradicted, negation]
        rationale: Los 30 kilómetros son correctos; la subida de la tarifa contradice que no cambiará.
  C6:
    modality: news_vs_newsletter
    passages:
      A:
        source: La Voz de Riomar, 03/06/2025
        text: >-
          El festival de cine de Riomar reunió a 12.000 espectadores en su última edición. La película ganadora fue «El faro
          apagado», de la directora Inés Soler.
      B:
        source: Crónica del Sur, 04/06/2025
        text: >-
          La concejala de Cultura de Riomar anunció que la próxima edición del festival se celebrará en septiembre.
    cases:
      - id: IC-14
        claim: >-
          El festival de cine de Riomar reunió a 12.000 espectadores, su próxima edición será en octubre y contará con un
          jurado internacional.
        passage_order: [A, B]
        label: contradicted
        evidence: [B]
        quote: la próxima edición del festival se celebrará en septiembre
        required_values: ["octubre", "septiembre"]
        critical: true
        tags: [multi_claim, correct_contradicted_unsupported, cross_source]
        rationale: Los espectadores son correctos, octubre contradice septiembre y el jurado no aparece.
      - id: IC-15
        claim: La película ganadora del festival de Riomar fue «El faro apagado», de Inés Soler.
        passage_order: [B, A]
        label: supported
        evidence: [A]
        tags: [simple_control]
        rationale: El pasaje da el título y la directora.
